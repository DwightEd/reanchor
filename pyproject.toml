[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reanchor"
version = "0.3.0"
description = "Inspect concrete attention shifts before a generated error"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5",
  "numpy",
  "tqdm",
  "transformers>=4.46,<4.58",
]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
