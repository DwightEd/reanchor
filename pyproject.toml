[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reanchor"
version = "0.2.0"
description = "Factorial causal measurement of constraint control in language generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "tqdm",
  "transformers>=4.46,<4.58",
]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
