[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reanchor"
version = "0.1.0"
description = "Label-free discovery and causal tracing of reanchor transitions in language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib",
  "numpy",
  "scikit-learn",
  "torch",
  "transformers>=4.57,<4.58",
  "tqdm",
]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[project.scripts]
reanchor = "reanchor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
